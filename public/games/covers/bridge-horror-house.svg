<svg width="640" height="400" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bridge Horror House cover">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0B16"/>
      <stop offset="0.55" stop-color="#1B1220"/>
      <stop offset="0.8" stop-color="#3A1E1B"/>
      <stop offset="1" stop-color="#0A0A10"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2E6C8" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#F2E6C8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#F2E6C8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD86A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFD86A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="60" cy="50" r="1.6" opacity="0.8"/><circle cx="140" cy="90" r="1.2" opacity="0.5"/>
    <circle cx="220" cy="40" r="1.8" opacity="0.9"/><circle cx="300" cy="80" r="1.2" opacity="0.5"/>
    <circle cx="380" cy="45" r="1.5" opacity="0.7"/><circle cx="470" cy="95" r="1.2" opacity="0.5"/>
    <circle cx="560" cy="55" r="1.7" opacity="0.8"/><circle cx="610" cy="130" r="1.2" opacity="0.5"/>
    <circle cx="100" cy="140" r="1.2" opacity="0.4"/><circle cx="520" cy="150" r="1.3" opacity="0.45"/>
  </g>
  <!-- moon + glow -->
  <circle cx="492" cy="108" r="86" fill="url(#moonglow)"/>
  <circle cx="492" cy="108" r="44" fill="#EFE2C2"/>
  <circle cx="478" cy="98" r="8" fill="#D9CBA6" opacity="0.8"/>
  <circle cx="504" cy="120" r="5.5" fill="#D9CBA6" opacity="0.7"/>
  <circle cx="496" cy="94" r="4" fill="#D9CBA6" opacity="0.6"/>
  <!-- dead trees -->
  <g stroke="#050507" stroke-linecap="round" fill="none">
    <path d="M70 320 L78 230 L60 190 M78 250 L104 226 M78 262 L54 244 M78 230 L86 200" stroke-width="9"/>
    <path d="M586 322 L578 244 L598 210 M578 264 L552 244 M578 244 L570 214" stroke-width="8"/>
  </g>
  <!-- house silhouette -->
  <g fill="#050507">
    <rect x="200" y="190" width="240" height="140"/>
    <polygon points="180,195 320,110 460,195"/>
    <rect x="232" y="150" width="34" height="52"/>
    <polygon points="226,152 249,128 272,152"/>
  </g>
  <!-- lit windows -->
  <g fill="#FFC65C">
    <rect x="236" y="230" width="26" height="34"/>
    <rect x="290" y="230" width="26" height="34"/>
    <rect x="378" y="230" width="26" height="34"/>
  </g>
  <g stroke="#050507" stroke-width="4">
    <line x1="249" y1="230" x2="249" y2="264"/><line x1="236" y1="247" x2="262" y2="247"/>
    <line x1="303" y1="230" x2="303" y2="264"/><line x1="290" y1="247" x2="316" y2="247"/>
    <line x1="391" y1="230" x2="391" y2="264"/><line x1="378" y1="247" x2="404" y2="247"/>
  </g>
  <!-- door -->
  <rect x="342" y="252" width="30" height="78" fill="#0D0A08" stroke="#2A1D12" stroke-width="2"/>
  <circle cx="366" cy="292" r="2.6" fill="#C9A84C"/>
  <!-- flashlight beam from bottom-left -->
  <polygon points="120,400 190,400 330,190 300,190" fill="url(#beam)" opacity="0.5"/>
  <!-- ground fog -->
  <ellipse cx="320" cy="352" rx="330" ry="34" fill="#0A0A10" opacity="0.85"/>
  <ellipse cx="200" cy="344" rx="150" ry="16" fill="#3A3F52" opacity="0.25"/>
  <ellipse cx="450" cy="348" rx="170" ry="18" fill="#3A3F52" opacity="0.22"/>
  <!-- title -->
  <text x="320" y="72" text-anchor="middle" font-family="Georgia, serif" font-weight="900" font-size="44" letter-spacing="8" fill="#F2E6C8">BRIDGE</text>
  <text x="320" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="17" letter-spacing="10" fill="#C9A84C">HORROR HOUSE</text>
</svg>
