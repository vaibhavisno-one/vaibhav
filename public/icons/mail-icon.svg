  <path d="M 20 75 L 100 20 L 180 75 L 180 175 L 20 175 Z" fill="#FFC93A" stroke="#0a0a0a" stroke-width="7" stroke-linejoin="round"/>
  <!-- Triangular flap top -->
  <path d="M 22 76 L 100 22 L 178 76" fill="#FFC93A" stroke="#0a0a0a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Paper -->
  <rect x="34" y="44" width="132" height="118" rx="3" fill="#F3F0F0" stroke="#0a0a0a" stroke-width="7"/>
  <!-- Lines on paper -->
  <rect x="56" y="72" width="88" height="9" rx="4.5" fill="#0a0a0a"/>
  <rect x="56" y="96" width="88" height="9" rx="4.5" fill="#0a0a0a"/>
  <rect x="56" y="120" width="62" height="9" rx="4.5" fill="#0a0a0a"/>
  <!-- Front V folds -->
  <path d="M 20 75 L 100 135 L 180 75" fill="none" stroke="#0a0a0a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 20 175 L 100 135 L 180 175" fill="#FFB626" stroke="#0a0a0a" stroke-width="7" stroke-linejoin="round"/>
  <path d="M 100 135 L 20 75" fill="none" stroke="#0a0a0a" stroke-width="7" stroke-linecap="round"/>
</svg>
